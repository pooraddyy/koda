name: Publish Koda CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Build and publish terminal CLI
    runs-on: ubuntu-latest
    environment: npm
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare Linux sandbox helper
        uses: ./.github/actions/setup-linux-sandbox
      - name: Build CLI packages
        run: koda_VERSION="$(node -p 'require("./packages/opencode/package.json").version')" bun run cli:build
      - name: Upload CLI release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koda-cli-dist
          path: packages/opencode/dist
          if-no-files-found: error
          retention-days: 1
      - name: Publish npm package
        if: env.NPM_CONFIG_TOKEN != ''
        run: bun run cli:publish
