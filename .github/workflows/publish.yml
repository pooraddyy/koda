name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  push:
    branches:
      - ci
      - dev
      - beta
      - fix/npm-native-binary-install
      - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'pooraddyy/opencode-cli'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          koda-app-id: ${{ vars.KODA_APP_ID }}
          koda-app-secret: ${{ secrets.KODA_APP_SECRET }}

      - name: Install Koda
        if: inputs.bump || inputs.version
        run: bun i -g koda-ai

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          KODA_BUMP: ${{ inputs.bump }}
          KODA_VERSION: ${{ inputs.version }}
          KODA_API_KEY: ${{ secrets.KODA_API_KEY }}
          GH_REPO: ${{ (github.ref_name == 'beta' && 'pooraddyy/opencode-cli-beta') || github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'pooraddyy/opencode-cli'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          koda-app-id: ${{ vars.KODA_APP_ID }}
          koda-app-secret: ${{ secrets.KODA_APP_SECRET }}

      - name: Build
        id: build
        run: |
          ./packages/koda/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
          ./packages/cli/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          KODA_VERSION: ${{ needs.version.outputs.version }}
          KODA_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koda-cli
          path: |
            packages/koda/dist/koda-darwin*
            packages/koda/dist/koda-linux*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koda-cli-windows
          path: packages/koda/dist/koda-windows*

    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-macos:
    needs:
      - build-cli
      - version
    runs-on: macos-26
    if: github.repository == 'pooraddyy/opencode-cli'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: koda-cli
          path: packages/koda/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          koda-app-id: ${{ vars.KODA_APP_ID }}
          koda-app-secret: ${{ secrets.KODA_APP_SECRET }}

      - name: Sign macOS CLI binaries
        run: |
          identity=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity not found"
            exit 1
          fi

          for name in koda-darwin-arm64 koda-darwin-x64 koda-darwin-x64-baseline; do
            file="packages/koda/dist/$name/bin/koda"
            chmod +x "$file"
            codesign \
              --force \
              --timestamp \
              --options runtime \
              --entitlements packages/koda/script/entitlements.plist \
              --sign "$identity" \
              "$file"
            codesign --verify --deep --strict --verbose=4 "$file"
            codesign --display --requirements - "$file"
          done

      - name: Smoke test signed binary
        run: ./packages/koda/dist/koda-darwin-arm64/bin/koda --version

      - name: Repack macOS CLI archives
        working-directory: packages/koda/dist
        run: |
          for name in koda-darwin-arm64 koda-darwin-x64 koda-darwin-x64-baseline; do
            rm -f "$name.zip"
            (cd "$name/bin" && zip -r "../../$name.zip" *)
          done

      - name: Upload signed macOS CLI release assets
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" \
            packages/koda/dist/koda-darwin-arm64.zip \
            packages/koda/dist/koda-darwin-x64.zip \
            packages/koda/dist/koda-darwin-x64-baseline.zip \
            --clobber \
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koda-cli-signed-macos
          path: |
            packages/koda/dist/koda-darwin-arm64
            packages/koda/dist/koda-darwin-x64
            packages/koda/dist/koda-darwin-x64-baseline
            packages/koda/dist/koda-darwin-*.zip
          if-no-files-found: error

  sign-cli-windows:
    needs:
      - build-cli
      - version
    runs-on: blacksmith-4vcpu-windows-2025
    if: github.repository == 'pooraddyy/opencode-cli'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: koda-cli-windows
          path: packages/koda/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          koda-app-id: ${{ vars.KODA_APP_ID }}
          koda-app-secret: ${{ secrets.KODA_APP_SECRET }}

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\koda\dist\koda-windows-arm64\bin\koda.exe
            ${{ github.workspace }}\packages\koda\dist\koda-windows-x64\bin\koda.exe
            ${{ github.workspace }}\packages\koda\dist\koda-windows-x64-baseline\bin\koda.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\koda\dist\koda-windows-arm64\bin\koda.exe",
            "${{ github.workspace }}\packages\koda\dist\koda-windows-x64\bin\koda.exe",
            "${{ github.workspace }}\packages\koda\dist\koda-windows-x64-baseline\bin\koda.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/koda/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "koda-windows-arm64\bin\*" -DestinationPath "koda-windows-arm64.zip" -Force
          Compress-Archive -Path "koda-windows-x64\bin\*" -DestinationPath "koda-windows-x64.zip" -Force
          Compress-Archive -Path "koda-windows-x64-baseline\bin\*" -DestinationPath "koda-windows-x64-baseline.zip" -Force

      - name: Upload signed Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\koda\dist\koda-windows-arm64.zip" `
            "${{ github.workspace }}\packages\koda\dist\koda-windows-x64.zip" `
            "${{ github.workspace }}\packages\koda\dist\koda-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koda-cli-signed-windows
          path: |
            packages/koda/dist/koda-windows-arm64
            packages/koda/dist/koda-windows-x64
            packages/koda/dist/koda-windows-x64-baseline

  publish:
    needs:
      - version
      - build-cli
      - sign-cli-macos
      - sign-cli-windows
    if: always() && !failure() && !cancelled()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: koda-cli
          path: packages/koda/dist

      - name: Remove unsigned macOS CLI binaries
        run: rm -rf packages/koda/dist/koda-darwin*

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: koda-cli-signed-macos
          path: packages/koda/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: koda-cli-windows
          path: packages/koda/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: koda-cli-signed-windows
          path: packages/koda/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          koda-app-id: ${{ vars.KODA_APP_ID }}
          koda-app-secret: ${{ secrets.KODA_APP_SECRET }}

      - name: Cache apt packages (AUR)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "koda@sst.dev"
          git config --global user.name "koda"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          KODA_VERSION: ${{ needs.version.outputs.version }}
          KODA_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
          LATEST_YML_DIR: /tmp/latest-yml
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
