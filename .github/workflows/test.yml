name: Terminal tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    name: CLI and TUI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check terminal UI types
        run: bun run --cwd packages/tui typecheck
      - name: Run terminal UI tests
        run: bun test --cwd packages/tui
      - name: Run focused agent tests
        run: bun test --cwd packages/opencode test/koda
