# koda_change - new file
name: "Setup Koda CLI"
description: "Install the public Koda terminal CLI and expose it on PATH"
runs:
  using: "composite"
  steps:
    - name: Install Koda CLI
      run: curl -fsSL https://raw.githubusercontent.com/pooraddyy/koda/main/install.sh | bash
      shell: bash

    - name: Add Koda to PATH
      run: echo "$HOME/.koda/bin" >> $GITHUB_PATH
      shell: bash
